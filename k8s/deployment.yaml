apiVersion: apps/v1
kind: Deployment
metadata:
  name: mechanics-execution-api
  namespace: mechanics-execution
  labels:
    app: mechanics-execution-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mechanics-execution-api
  template:
    metadata:
      labels:
        app: mechanics-execution-api
      annotations:
        ad.datadoghq.com/api.logs: >-
          [{"source":"dotnet","service":"mechanics-execution-api"}]
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      automountServiceAccountToken: false
      containers:
        - name: api
          image: ghcr.io/torque-os/mechanics-execution-service:latest # NOSONAR
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: execution-config
            - secretRef:
                name: execution-secrets
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
